<script>
(async () => {
  // 差し替えの途中で失敗すると #m が消えているので、そのときは画面に書き直す（最後の手段は alert）
  const say = t => { const m = document.getElementById("m"); if (m) { m.textContent = t; return; }
    try { document.open(); document.write('<p style="margin:22vh auto 0;padding:0 20px;max-width:30em;text-align:center;font:15px/1.8 system-ui,sans-serif"></p>'); document.close(); document.querySelector("p").textContent = t; } catch (e) { alert(t); } };
  const k = (location.hash.match(/(?:^#|&)k=([A-Za-z0-9_-]{43})(?:&|$)/) || [])[1];
  if (!k) return say("このページは、共有されたリンクをそのまま開いてください（リンクの最後の「#k=…」まで要ります）。");
  if (!(window.crypto && crypto.subtle)) return say("このブラウザでは開けません。Safari か Chrome の新しい版で開いてください。");
  const bin = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
  try {
    const key = await crypto.subtle.importKey("raw", bin(k.replace(/-/g, "+").replace(/_/g, "/") + "="), "AES-GCM", false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: bin(document.getElementById("iv").textContent.trim())}, key, bin(document.getElementById("ct").textContent.trim()));
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch (e) { say("開けませんでした。共有されたリンクを、そのまま Safari か Chrome で開き直してください。"); }
})();
</script>
